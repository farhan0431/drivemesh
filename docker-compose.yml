services:
  # 1. PostgreSQL Database
  db:
    image: postgres:17-alpine
    container_name: drivemesh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drivemesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-drivemesh}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - drivemesh-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drivemesh}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Express.js Core Streaming Engine
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: drivemesh-server
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor=drivemesh-fuse
    ports:
      - "127.0.0.1:5080:5080"
      - "${SMB_BIND_ADDRESS:-127.0.0.1}:445:445"
    environment:
      NODE_ENV: production
      PORT: 5080
      LISTEN_HOST: 0.0.0.0
      TRUST_PROXY: 1
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      SMB_HOST: ${SMB_HOST:?Set SMB_HOST}
      DATABASE_URL: postgresql://${POSTGRES_USER:-drivemesh}:${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-drivemesh}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      MASTER_KEY: ${MASTER_KEY:?Set a unique MASTER_KEY of at least 32 characters}
    volumes:
      - drivemesh-samba:/var/lib/samba
      - drivemesh-write-cache:/var/lib/drivemesh/cache
    depends_on:
      db:
        condition: service_healthy

  # 3. Nuxt 3 Web Portal
  client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    container_name: drivemesh-client
    restart: unless-stopped
    ports:
      - "127.0.0.1:3080:3080"
    environment:
      NODE_ENV: production
      PORT: 3080
      NITRO_PORT: 3080
      NUXT_API_PROXY_TARGET: http://server:5080
    depends_on:
      - server

volumes:
  drivemesh-pgdata:
  drivemesh-samba:
  drivemesh-write-cache:
